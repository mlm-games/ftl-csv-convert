name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      mark_prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version in Cargo.toml
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TOML="Cargo.toml"
          BUMP_TYPE="${{ inputs.version_bump || 'patch' }}"

          OLD_VERSION=$(grep -m1 '^version\s*=\s*"' "$CARGO_TOML" | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$OLD_VERSION" ]]; then
            echo "::error::Could not detect version in Cargo.toml"
            exit 1
          fi

          IFS='.' read -r MAJ MIN PAT <<< "$OLD_VERSION"
          : "${MAJ:=0}" "${MIN:=0}" "${PAT:=0}"

          case "$BUMP_TYPE" in
            major) NEW_VERSION="$((MAJ+1)).0.0" ;;
            minor) NEW_VERSION="$MAJ.$((MIN+1)).0" ;;
            patch) NEW_VERSION="$MAJ.$MIN.$((PAT+1))" ;;
            *)     echo "::error::Invalid bump type: $BUMP_TYPE"; exit 1 ;;
          esac

          sed -i -E "0,/^version\s*=.*/s//version = \"$NEW_VERSION\"/" "$CARGO_TOML"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $OLD_VERSION -> $NEW_VERSION ($BUMP_TYPE)"

      - name: Update Cargo.lock
        run: cargo update -w

      - name: Commit and create tag
        id: commit
        shell: bash
        run: |
          set -e
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="v$VERSION"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump to $TAG [skip ci]"
          git push

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Created tag: $TAG"

  build:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euxo pipefail
          APP="ftl-csv-convert"
          OS="${{ matrix.os }}"
          if [[ "$OS" == "ubuntu-latest" ]]; then
            PLAT="linux-x86_64"
          elif [[ "$OS" == "windows-latest" ]]; then
            PLAT="windows-x86_64"
          elif [[ "$OS" == "macos-14" ]]; then
            PLAT="macos-aarch64"
          else
            PLAT="${{ matrix.target }}"
          fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${APP}${{ matrix.suffix }}" "dist/${APP}-${PLAT}${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [prepare-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euxo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          chmod +x * 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare-version.outputs.version }}
          name: v${{ needs.prepare-version.outputs.version }}
          target_commitish: ${{ needs.prepare-version.outputs.commit_sha }}
          generate_release_notes: true
          prerelease: ${{ inputs.mark_prerelease || false }}
          files: release/*
