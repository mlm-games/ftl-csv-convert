name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  aur:
    uses: mlm-games/ci/.github/workflows/aur-upload.yml@main
    with:
      pkgname: ftl-csv-convert-bin
      pkgdesc: "Bidirectional converter between Fluent (.ftl) locale trees and a single CSV"
      binary-name: ftl-csv-convert-linux-x86_64
      app-slug: ftl-csv-convert
      license: "MIT OR Apache-2.0"
      depends: ""
      provides: ftl-csv-convert
      conflicts: ftl-csv-convert
      maintainer-name: mlm-games
      maintainer-email: 125530737+mlm-games@users.noreply.github.com
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
